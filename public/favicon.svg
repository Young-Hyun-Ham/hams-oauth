<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="80" fill="#0b172a" />

  <!-- 텍스트 그룹 -->
  <g fill="#b9e6fe" font-family="system-ui, -apple-system, sans-serif" font-weight="800">
    <!-- 좌측 H & ams (세로 회전) -->
    <text x="75" y="140" font-size="110">H</text>
    <text x="198" y="142" font-size="42" transform="rotate(-90, 198, 142)">ams</text>

    <!-- 우측 O & auth (세로 회전) -->
    <text x="290" y="140" font-size="110">O</text>
    <text x="422" y="148" font-size="42" transform="rotate(-90, 422, 148)">auth</text>
  </g>

  <!-- 메인 그래픽 그룹 -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 방패 외곽선 -->
    <path d="M 256 130 Q 310 170 395 180 V 275 C 395 365 310 425 256 450 C 202 425 117 365 117 275 V 180 Q 202 170 256 130 Z" stroke-width="16" />

    <!-- 좌우 연결 고리 (무한대/SSO) -->
    <path d="M 175 285 C 105 235 105 335 175 285 Z" stroke-width="14" />
    <path d="M 337 285 C 407 235 407 335 337 285 Z" stroke-width="14" />

    <!-- 중앙 원형 테두리 및 배경 덮개 -->
    <circle cx="256" cy="285" r="66" fill="#0b172a" stroke-width="16" />
    <!-- 내부 열쇠구멍 하늘색 채우기 -->
    <circle cx="256" cy="285" r="58" fill="#38bdf8" stroke="none" />
    <!-- 열쇠구멍 컷아웃 (배경색으로 뚫기) -->
    <circle cx="256" cy="270" r="16" fill="#0b172a" stroke="none" />
    <polygon points="244,272 268,272 274,318 238,318" fill="#0b172a" stroke="none" />
  </g>

  <!-- 우측 하단 반짝이(스파클) 아이콘 -->
  <path d="M 430 380 Q 430 420 390 420 Q 430 420 430 460 Q 430 420 470 420 Q 430 420 430 380 Z" fill="#52657a" />
</svg>
